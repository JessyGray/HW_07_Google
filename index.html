<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../07-hw-google/css/style.css">
    <link rel="icon"
        href="https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/1280px-Google_%22G%22_logo.svg.png?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&display=swap"
        rel="stylesheet">
    <title>Google</title>
</head>

<body>
    <nav>
        <a href="https://mail.google.com/">Gmail</a>
        <a href="https://www.google.com/imghp">Images</a>
    </nav>
    <div class="center">
        <a href="https://www.google.com" class="logo-text">
            <div class="logo-text">
                <div class="blue">J</div>
                <div class="red">e</div>
                <div class="yellow">s</div>
                <div class="blue">s</div>
                <div class="green">y</div>
                <div class="red">.</div>
            </div>
        </a>
        <form name="search" action="https://www.google.com/search" autocomplete="off">
            <div class="search-box">
                <div class="plus"><button type="button"><img src="https://www.svgrepo.com/show/423643/add.svg"></button>
                </div>
                <label>
                    <input type="text" name="q" autocomplete="off">
                </label>
                <button type="button" class="mic">
                    <img src=" https://cdn.creazilla.com/icons/3205054/mic-icon-lg.png" alt="microphone">
                </button>
                <button type="button" class=" lens">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d6/Google_Lens_Icon.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
                        alt="Google Lens">
                </button>
                <div>
                    <button type="button" class="ai-mode">
                        <div class="ai-icon">✦</div> AI Mode
                    </button>
                </div>
            </div>
            <div class="search-buttons">
                <div>
                    <button type="submit">Google Search</button>
                </div>
                <div>
                    <button type="submit" name="btnI" value="1">
                        I'm Feeling Lucky
                    </button>
                </div>
            </div>
        </form>
    </div>

    <footer>
        <div class="footer-left">
            <a href="https://about.google/">About</a>
            <a href="https://policies.google.com/technologies/ads">Advertising</a>
            <a href="https://www.google.com/business/">Business</a>
            <a href="https://www.google.com/search/howsearchworks/">How Search works</a>
        </div>

        <div class="footer-right">
            <a href="https://policies.google.com/privacy">Privacy</a>
            <a href="https://policies.google.com/terms">Terms</a>
            <a href="https://www.google.com/preferences">Settings</a>
        </div>
    </footer>
</body>

</html>
